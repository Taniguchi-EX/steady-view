plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// JUnit等のテスト用ライブラリの取得元
	mavenCentral()
	// Mod Menu（設定画面を「Mod」一覧から開くため）
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	// Text Placeholder API（Mod Menuが必要とする。開発用の起動・ゲーム内テストでだけ使う）
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"steadyview" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu。入っていれば「Mod」一覧から設定画面を開ける（必須ではないため、コンパイル時だけ使う）
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// 開発用の起動（runClient）とゲーム内テストでは、Mod Menuも入れて「Mod」一覧から設定画面を開けることを確かめる
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "eu.pb4:placeholder-api:${project.placeholder_api_version}"

	// 角度の計算等、マイクラに依存しない処理の単体テスト用
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

// ゲーム内の自動テスト（src/gametest）。runClientGameTestで実行する
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "steadyview-test"
		enableGameTests = false
		enableClientGameTests = true
		// マイクラのEULAへの同意（オンライン公園のサーバ構築時に同意済み）
		eula = true
	}
}

dependencies {
	// ゲーム内テストで、Mod Menuの入口（ModMenuApi）を呼んで確かめるため（gametestのソースセットは上のfabricApiで作られる）
	gametestCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
